name: Deploy Student Task Manager

# Plan on every push/PR to main; apply only on main and only after a
# manual approval (GitHub Environment "production" with required reviewers).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; never cancel a run that may be mid-apply.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false


env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_workers_subdomain: ${{ vars.WORKERS_SUBDOMAIN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  test:
    name: Application tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  plan:
    name: Terraform plan
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init
        run: terraform init -input=false
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -input=false -out=tfplan
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  apply:
    name: Terraform apply (approval required)
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in repo Settings > Environments
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - name: Init
        run: terraform init -input=false
      - name: Apply the reviewed plan
        run: terraform apply -input=false tfplan
      - name: Show outputs
        run: terraform output
